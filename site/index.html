<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>antifeed</title>
<meta name="description" content="One good read a day. No scroll, no bait.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=2026-07-25d">
<script>
// apply saved theme before first paint
(function(){var t=localStorage.getItem("antifeed:theme");if(t)document.documentElement.dataset.theme=t;})();
</script>
</head>
<body>
<header class="site-head">
  <h1 class="wordmark">anti<span>feed</span></h1>
  <nav>
    <a href="https://kaushikbhat.com">kb</a>
    <a href="about/">about</a>
    <button id="theme-btn" aria-label="toggle theme"></button>
  </nav>
</header>
<p class="tagline">one good read a day. no scroll, no bait.</p>

<nav class="tabs" id="tabs">
  <button data-tab="must" class="active">must reads</button>
  <button data-tab="more">more</button>
  <button data-tab="mine">mine</button>
  <span class="tab-spacer"></span>
  <button data-tab="f" class="icon-tab" title="starred" aria-label="starred"><svg class="i-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2.5l2.9 6.1 6.6.7-4.9 4.5 1.4 6.6L12 17.1 6 20.4l1.4-6.6-4.9-4.5 6.6-.7L12 2.5z"/></svg></button>
  <button data-tab="r" class="icon-tab" title="read" aria-label="read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>
  <button data-tab="x" class="icon-tab" title="skipped" aria-label="skipped"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
</nav>

<main>
  <form id="add-form" class="card mini" hidden autocomplete="off">
    <div class="kicker">save for later</div>
    <input id="add-url" type="text" inputmode="url" placeholder="paste a link worth keeping…" required>
    <input id="add-note" type="text" placeholder="note — who shared it / why it caught you (optional)">
    <div class="actions">
      <button class="go" type="submit">Save it →</button>
    </div>
  </form>

  <section id="today" aria-label="Today's read"></section>

  <section id="archive-section" aria-label="Archive">
    <div class="archive-head">
      <h2 id="archive-title">previously</h2>
    </div>
    <ol id="archive" class="archive"></ol>
    <p id="empty" class="empty" hidden></p>
  </section>
</main>

<footer>
  <p>Curated for and by <a href="https://kaushikbhat.com" target="_blank" rel="noopener">kb</a> ·
    the reading list is public, the flags are yours ·
    <a href="https://github.com/kaushikb9/antifeed" target="_blank" rel="noopener">source</a> ·
    <button id="sync-btn" class="linkish"></button></p>
</footer>

<script src="app.js"></script>
</body>
</html>
