<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>antifeed</title>
<meta name="description" content="One good read a day. No scroll, no bait.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛏️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 class="wordmark">anti<span>feed</span></h1>
  <p class="tagline">one good read a day. no scroll, no bait.</p>
</header>

<main>
  <section id="today" aria-label="Today's read"></section>

  <section id="archive-section" aria-label="Archive">
    <div class="archive-head">
      <h2>previously</h2>
      <nav class="filters" id="filters">
        <button data-filter="all" class="active">all</button>
        <button data-filter="b" title="bookmarked">read later</button>
        <button data-filter="f" title="favorites">favorites</button>
        <button data-filter="s" title="to share">share</button>
      </nav>
    </div>
    <button id="copy-share" hidden>copy share list as markdown</button>
    <ol id="archive" class="archive"></ol>
    <p id="empty" class="empty" hidden></p>
  </section>
</main>

<footer>
  <p>curated daily by a robot with taste · flags live in this browser only</p>
</footer>

<script src="app.js"></script>
</body>
</html>
