<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>antifeed</title>
<meta name="description" content="One good read a day. No scroll, no bait.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1 class="wordmark">anti<span>feed</span></h1>
  <p class="tagline">one good read a day. no scroll, no bait.</p>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="must" class="active">must reads</button>
  <button data-tab="more">more</button>
  <button id="add-link" class="add" title="add a link you found or were sent">+ link</button>
</nav>

<main>
  <section id="today" aria-label="Today's read"></section>

  <section id="archive-section" aria-label="Archive">
    <div class="archive-head">
      <h2 id="archive-title">previously</h2>
      <nav class="filters" id="filters">
        <button data-filter="all" class="active">all</button>
        <button data-filter="r" title="read">✓</button>
        <button data-filter="f" title="starred">★</button>
        <button data-filter="x" title="skipped">✕</button>
      </nav>
    </div>
    <ol id="archive" class="archive"></ol>
    <p id="empty" class="empty" hidden></p>
  </section>
</main>

<footer>
  <p>curated daily by <a href="https://kaushikbhat.com" target="_blank" rel="noopener">kb</a>’s second
    <svg class="brain" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="brain">
      <title>brain</title>
      <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
      <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
    </svg>
    · <button id="sync-btn" class="linkish"></button></p>
</footer>

<script src="app.js"></script>
</body>
</html>
